# Fetch the fund's holdings CSVs, update the yearly change reports and publish them on GitHub Pages.
#
# State lives on the `gh-pages` branch: data/holdings-YYYY-MM-DD.csv (every CSV fetched so far) and the
# reports (index.html, Index-YYYY.html) at its root.  Each run checks that branch out, runs
# cli/holdings_report.py against it (it only fetches the days missing since the last CSV) and pushes
# the result back.  Pages setting: Settings -> Pages -> Source "Deploy from a branch", branch gh-pages, / (root).
#
# Runs four times a day (07:00, 11:00, 15:00, 19:00 UTC) and on demand (Actions -> Run workflow).
name: holdings-report

on:
  schedule:
    - cron: "0 7,11,15,19 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Regenerate every Index-YYYY.html from the stored CSVs"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: holdings-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the script
        uses: actions/checkout@v4

      - name: Check out the published site (gh-pages) or start it
        run: |
          set -e
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          else
            mkdir site && cd site && git init -q -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            touch .nojekyll
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/requirements.txt

      - name: Install the script's dependencies
        run: pip install -r cli/requirements.txt

      - name: Fetch the missing holdings days and update the reports
        run: |
          python cli/holdings_report.py --data-dir site/data --report-dir site --pause 1 \
            ${{ inputs.rebuild && '--rebuild' || '' }}

      - name: Publish
        run: |
          cd site
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "holdings report: $(date -u +'%Y-%m-%d %H:%M UTC') — latest $(ls data | tail -1 | sed 's/holdings-//; s/.csv//')"
          git push origin gh-pages
